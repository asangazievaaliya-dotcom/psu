<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aliia Asangazieva</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #06345c, #0077d9);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 60px 40px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
      color: #0f2542;
      font-size: 32px;
    }

    .btn {
      display: inline-block;
      background: #0074d9;
      color: white;
      text-decoration: none;
      padding: 14px 26px;
      margin: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #005fae;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .card {
        width: 85%;
        padding: 40px 20px;
      }

      .btn {
        display: block;
        width: 80%;
        margin: 12px auto;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Aliia Asangazieva</h1>

    <a class="btn" href="https://docs.google.com/document/d/1UjQWWARB8c6sTAokyk3MQsuWKwpJXbqlps2Ra9NVeY0/edit?usp=sharing" target="_blank">
      My Resume
    </a>

    <a class="btn" href="https://www.linkedin.com/in/aliia-asangazieva-236197331" target="_blank">
      LinkedIn
    </a>

    <a class="btn" href="https://github.com/asangazievaaliya-dotcom" target="_blank">
      GitHub
    </a>

  </div>

</body>
</html>
